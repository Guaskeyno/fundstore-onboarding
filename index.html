<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Fundstore Onboarding</title>
<!-- GitHub Pages only serves index.html by default: this forwards to the first XHTML page.
     Links from the earlier single-page version (#app/esperti etc.) go to the matching page. -->
<script>
  var PAGES = ['dossier', 'fondi', 'movimenti', 'ordini', 'esperti', 'posta', 'approfondimenti', 'profilo'];
  var m = location.hash.match(/^#app\/([a-z]+)/);
  location.replace(m && PAGES.indexOf(m[1]) > -1 ? m[1] + '.xhtml' : 'signup.xhtml');
</script>
<meta http-equiv="refresh" content="1; url=signup.xhtml">
</head>
<body>
<p><a href="signup.xhtml">Apri il prototipo Fundstore</a></p>
</body>
</html>
