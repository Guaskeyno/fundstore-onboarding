<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="it" xml:lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Crea la password · Registrati a Fundstore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,300&amp;family=Onest:wght@400;500;600;700&amp;display=swap" />

<!-- Icons: Phosphor Icons 2.1.1 (MIT), vendored in vendor/phosphor-icons -->
<link rel="stylesheet" href="vendor/phosphor-icons/regular/style.css" />
<link rel="stylesheet" href="vendor/phosphor-icons/bold/style.css" />
<link rel="stylesheet" href="vendor/phosphor-icons/duotone/style.css" />

<!-- Prototype styles -->
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/signup.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/prototype.css" />
<link rel="stylesheet" href="css/animations.css" />

<!-- jQuery 3.7.1 (as in production) + shared helpers/state; loaded in <head> so returning visits skip the entrance animations -->
<script src="vendor/jquery/jquery-3.7.1.min.js"></script>
<script src="js/core.js"></script>
</head>
<body data-page="signup-password" data-toast="Email verificata">

<p class="proto-badge"><i class="ph ph-info" aria-hidden="true"></i>Prototipo di design · i dati inseriti non vengono inviati</p>

<div id="signup">
<main class="shell">
<section class="panel">
    <div class="toast-region" role="status" aria-live="polite"></div>

    <div class="column">
      <div class="logo" role="img" aria-label="Fundstore"></div>
      <h1 class="title" id="title">Registrati a Fundstore</h1>

      <!-- Step 1 · Choose method -->
      <!-- Step 2 · Personal details -->
      <!-- Step 3/4 · Create password -->
      <div class="step is-active" data-step="password">
        <form class="js-form">
          <p class="intro">Crea una password per l’accesso a Fundstore</p>

          <div class="field field--password" data-field="password" data-validate="password">
            <label class="label" for="password">Password</label>
            <div class="control">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="pw-rule" />
              <a class="control__toggle" href="#" role="button" aria-label="Mostra password" aria-pressed="false"><i class="ph ph-eye"></i></a>
            </div>
            <div class="rule" id="pw-rule"><i class="ph-duotone ph-check-circle" aria-hidden="true"></i><span>almeno 8 caratteri</span></div>
          </div>

          <div class="field field--password" data-field="confirm" data-validate="confirm" data-match="password">
            <label class="label" for="confirm">Conferma la Password</label>
            <div class="control">
              <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" aria-describedby="confirm-error" />
              <i class="ph-bold ph-check control__status" aria-hidden="true"></i>
              <a class="control__toggle" href="#" role="button" aria-label="Mostra password" aria-pressed="false"><i class="ph ph-eye"></i></a>
            </div>
            <div class="error" id="confirm-error"><span><i class="ph ph-warning-circle" aria-hidden="true"></i><em></em></span></div>
          </div>

          <div class="reveal">
            <div>
              <a class="btn btn--sky js-submit" href="#" role="button" tabindex="-1" data-prototype-next="dossier.xhtml"><span class="btn__label">Imposta password e accedi</span></a>
            </div>
          </div>
        </form>
      </div>

    </div>

    <footer class="footer">
      <p class="legal">
        Registrandoti a Fundstore, accetti i nostri
        <a class="link" href="#" data-unavailable="data-unavailable">Termini, Condizioni <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a>
        e <a class="link" href="#" data-unavailable="data-unavailable">Privacy Policy <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a>
      </p>
      <p class="account">
        Hai già un account?<a class="link link--bold" href="#" data-unavailable="data-unavailable">Accedi <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a>
      </p>
    </footer>
  </section>
<aside class="hero" aria-hidden="true"></aside>
</main>
</div>

<script src="js/forms.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
